<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Records - Record System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-brand">Record System</div>
        <div class="nav-links">
            <a href="/dashboard.html">Collections</a>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="container">
        <div class="header-row">
            <h1 id="colTitle">Loading Collection...</h1>
            <div class="actions">
                <button class="btn-secondary" id="exportBtn">Export JSON</button>
                <button class="btn-secondary" id="importBtn">Import JSON</button>
                <button class="btn-secondary" id="dedupBtn">Clean Duplicates</button>
                <button class="btn-primary" id="addRecBtn">+ Add Record</button>
            </div>
        </div>

        <div class="filter-bar card" style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center;">
            <input type="text" id="searchBox" placeholder="Search any field..." style="flex: 1; padding: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius);">
            <button class="btn-sm" id="searchBtn">Search</button>
        </div>

        <div class="table-container card">
            <table id="recordsTable" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr id="tableHead" style="border-bottom: 2px solid var(--border);">
                        <!-- Headers generated by schema -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows generated by data -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal for Add/Edit -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-content">
            <div id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" id="modalConfirm">Save Record</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const colId = urlParams.get('colId');
        let currentSchema = [];

        async function init() {
            if (!colId) {
                alert('No collection selected');
                window.location.href = '/dashboard.html';
                return;
            }

            const cols = await api.getCollections();
            const col = cols.find(c => c.id === colId);
            if (!col) {
                alert('Collection not found');
                window.location.href = '/dashboard.html';
                return;
            }
            document.getElementById('colTitle').textContent = col.name;
            currentSchema = col.schema;
            
            renderTableHead();
            await loadRecords();
        }

        function renderTableHead() {
            const head = document.getElementById('tableHead');
            head.innerHTML = currentSchema.map(s => `<th style="padding: 1rem;">${s.label}</th>`).join('') + 
                             `<th style="padding: 1rem; text-align: right;">Actions</th>`;
        }

        async function loadRecords() {
            const search = document.getElementById('searchBox').value;
            const records = await api.getRecords(colId, search);
            const body = document.getElementById('tableBody');
            
            if (records.length === 0) {
                body.innerHTML = `<tr><td colspan="${currentSchema.length + 1}" style="text-align:center; padding: 2rem; color: var(--text-light);">No records found.</td></tr>`;
                return;
            }

            body.innerHTML = records.map(rec => `
                <tr style="border-bottom: 1px solid var(--border);">
                    ${currentSchema.map(s => `<td style="padding: 1rem;">${rec[s.name] || ''}</td>`).join('')}
                    <td style="padding: 1rem; text-align: right;">
                        <button onclick="editRecord('${rec.id}')" class="btn-sm">Edit</button>
                        <button onclick="deleteRecord('${rec.id}')" class="btn-sm btn-danger">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openRecordModal(recId = null) {
            const body = document.getElementById('modalBody');
            const isEdit = !!recId;
            
            body.innerHTML = `
                <h2>${isEdit ? 'Edit Record' : 'Add New Record'}</h2>
                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    ${currentSchema.map(s => `
                        <div class="form-group">
                            <label>${s.label} ${s.required ? '*' : ''}</label>
                            ${s.type === 'textarea' 
                                ? `<textarea id="f_${s.name}" rows="3"></textarea>` 
                                : `<input type="${s.type}" id="f_${s.name}" ${s.required ? 'required' : ''}>`
                            }
                        </div>
                    `).join('')}
                </div>
            `;

            if (isEdit) {
                // We need to fetch the record or find it in current list
                // For simplicity, we'll assume we have a way to get it.
                // Better to fetch it or pass the data.
                window.currentEditingId = recId;
            } else {
                window.currentEditingId = null;
            }

            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        async function saveRecord() {
            const data = {};
            currentSchema.forEach(s => {
                data[s.name] = document.getElementById(`f_${s.name}`).value;
            });

            try {
                if (window.currentEditingId) {
                    await api.updateRecord(colId, window.currentEditingId, data);
                } else {
                    await api.addRecord(colId, data);
                }
                closeModal();
                await loadRecords();
            } catch (e) {
                alert(e.message);
            }
        }

        async function deleteRecord(id) {
            if (confirm('Delete this record?')) {
                await api.deleteRecord(colId, id);
                await loadRecords();
            }
        }

        async function editRecord(id) {
            openRecordModal(id);
            const records = await api.getRecords(colId);
            const rec = records.find(r => r.id === id);
            if (rec) {
                currentSchema.forEach(s => {
                    const el = document.getElementById(`f_${s.name}`);
                    if (el) el.value = rec[s.name] || '';
                });
            }
        }

        // UI Listeners
        document.getElementById('searchBtn').onclick = loadRecords;
        document.getElementById('searchBox').onkeyup = (e) => { if (e.key === 'Enter') loadRecords(); };
        document.getElementById('addRecBtn').onclick = () => openRecordModal();
        document.getElementById('modalConfirm').onclick = saveRecord;
        document.getElementById('exportBtn').onclick = () => api.exportRecords(colId);
        document.getElementById('logoutBtn').onclick = async () => {
            await api.logout();
            localStorage.removeItem('token');
            window.location.href = '/';
        };

        document.getElementById('importBtn').onclick = async () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                const text = await file.text();
                try {
                    const data = JSON.parse(text);
                    await api.importRecords(colId, data);
                    alert('Import successful');
                    await loadRecords();
                } catch (err) {
                    alert('Invalid JSON file');
                }
            };
            input.click();
        };

        document.getElementById('dedupBtn').onclick = async () => {
            const field = prompt('Enter the field name to deduplicate by (e.g., email):');
            if (!field) return;
            try {
                const res = await api.deduplicate(colId, field);
                alert(res.message);
                await loadRecords();
            } catch (e) {
                alert(e.message);
            }
        };

        window.onload = init;
    </script>
</body>
</html>
